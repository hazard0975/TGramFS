name: Build and Release Self-Contained Windows App

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: versioning
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Publish Self-Contained Executable
        run: |
          dotnet publish TelegramWebDAV/TelegramWebDAV.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableWindowsTargeting=true `
            -p:Version="${{ env.APP_VERSION }}" `
            -p:AssemblyVersion="${{ env.APP_VERSION }}" `
            -p:FileVersion="${{ env.APP_VERSION }}" `
            -o ./publish/

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath "TGramFS-${{ env.TAG_NAME }}-win-x64.zip"
          Copy-Item -Path ./publish/TGramFS.exe -Destination "TGramFS-${{ env.TAG_NAME }}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "TGramFS ${{ env.TAG_NAME }}"
          body: |
            ${{ github.sha }}: ${{ github.event.head_commit.message }}
            
          files: |
            TGramFS-${{ env.TAG_NAME }}-win-x64.zip
            TGramFS-${{ env.TAG_NAME }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
